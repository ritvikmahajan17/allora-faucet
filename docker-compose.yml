version: "3.8"

services:
  faucet:
    # For local development, use build
    build: .
    # For ECR deployment, use image (comment out build and uncomment image)
    # image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/allora-faucet:latest
    container_name: allora-faucet
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - EVM_ENDPOINT=${EVM_ENDPOINT:-http://localhost:8545}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
    volumes:
      - ./config/secret:/app/config/secret:ro
      - ./faucet.db:/app/faucet.db
    networks:
      - faucet-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  faucet-network:
    driver: bridge
